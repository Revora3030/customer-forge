---
engines:
  eslint:
    enabled: true
    exclude_paths:
      - node_modules/
      - dist/
      - .output/
      - .vinxi/

  pmd:
    enabled: false

  pmd-legacy:
    enabled: false

  # Supabase migrations are PostgreSQL, not Microsoft Transact-SQL.
  # Other SQL/security analyzers remain in scope.
  tsqllint:
    exclude_paths:
      - "supabase/migrations/**"

exclude_paths:
  - node_modules/
  - dist/
  - .output/
  - .vinxi/
