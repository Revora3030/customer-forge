# APIsec scan. Needs an APIsec account:
#   secrets   apisec_username, apisec_password
#   variable  APISEC_PROJECT (your project name in APIsec)
# Until they are set the job reports "not configured" and passes.
name: APIsec

on:
  push:
    branches: ["lovable-sync"]
  pull_request:
    branches: ["lovable-sync"]
  schedule:
    - cron: "23 17 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Trigger_APIsec_scan:
    permissions:
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        env:
          USER: ${{ secrets.apisec_username }}
          PASS: ${{ secrets.apisec_password }}
          PROJECT: ${{ vars.APISEC_PROJECT }}
        run: |
          if [ -n "$USER" ] && [ -n "$PASS" ] && [ -n "$PROJECT" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::APIsec is not configured (needs secrets apisec_username, apisec_password and variable APISEC_PROJECT); skipping."; fi

      - name: APIsec scan
        if: steps.cfg.outputs.ready == 'true'
        uses: apisec-inc/apisec-run-scan@025432089674a28ba8fb55f8ab06c10215e772ea
        with:
          apisec-username: ${{ secrets.apisec_username }}
          apisec-password: ${{ secrets.apisec_password }}
          apisec-project: ${{ vars.APISEC_PROJECT }}
          sarif-result-file: "apisec-results.sarif"

      - name: Import results
        if: ${{ steps.cfg.outputs.ready == 'true' && hashFiles('apisec-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./apisec-results.sarif
