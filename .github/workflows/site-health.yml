name: Site health
# Free daily check of the live platform pages (and any client sites listed in
# scripts/site-health-check.sh): HTTP status (404/403 count as failures),
# response time and SSL days left. On failure it opens, or adds a comment to,
# ONE issue labelled `site-health`; when everything passes again it comments
# and closes that issue. Read-only against the sites; uses only the built-in
# GITHUB_TOKEN (issues: write) and GitHub-owned actions.
on:
  schedule:
    - cron: "7 12 * * *" # daily, about 08:07 US Eastern
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: site-health
  cancel-in-progress: false
jobs:
  check:
    name: Check live sites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run health checks
        id: health
        run: |
          set +e
          REPORT_FILE="$RUNNER_TEMP/site-health-report.md" bash scripts/site-health-check.sh
          status=$?
          cat "$RUNNER_TEMP/site-health-report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open or update the site-health issue
        if: steps.health.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create site-health --color d93f0b --description "Daily site health check failed" 2>/dev/null || true
          {
            cat "$RUNNER_TEMP/site-health-report.md"
            echo
            echo "Workflow run: $RUN_URL"
          } > "$RUNNER_TEMP/issue-body.md"
          existing="$(gh issue list --label site-health --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue-body.md"
          else
            gh issue create --label site-health --title "Site health check failing" --body-file "$RUNNER_TEMP/issue-body.md"
          fi
      - name: Close the issue when healthy again
        if: steps.health.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --label site-health --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "All checks pass again. Closing. Run: $RUN_URL"
            gh issue close "$existing"
          fi
      - name: Fail the run when a check failed
        if: steps.health.outputs.status != '0'
        run: exit 1
