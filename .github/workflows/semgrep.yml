name: Revora Semgrep Analysis
on:
  push:
    branches: [lovable-sync, main]
  pull_request:
    branches: [lovable-sync, main]
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: revora-semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: Static analysis (report-first rollout)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Semgrep rules
        run: semgrep scan --config auto --json --output semgrep-results.json
      - name: Upload Semgrep findings
        if: always() && hashFiles('semgrep-results.json') != ''
        continue-on-error: true  # a full Actions artifact quota must not fail a job whose checks passed
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-results-${{ github.run_id }}
          path: semgrep-results.json
          retention-days: 30
