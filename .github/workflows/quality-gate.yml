name: Revora Quality Gate

on:
  push:
    branches:
      - lovable-sync
  pull_request:
    branches: [lovable-sync]

permissions:
  contents: read

concurrency:
  group: revora-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Repository security audit
        run: npm run security:audit

      - name: Security audit contract
        run: npm run security:audit:test

      - name: Website RPC security contract
        run: node scripts/website-rpc-security.contract.mjs

      - name: Browser journey contract
        run: npm run browser:journey:test

      - name: Lint
        run: npm run lint

      - name: Whole-repository audit
        run: npm run repo:audit

      - name: Whole-repository visual output contract
        run: npm run repo:visual-output

      - name: Ultimate builder output audit
        run: npm run builder:ultimate-audit

      - name: Whole-repository audit contract
        run: npm run repo:audit:test

      - name: Production readiness contract
        run: npm run production:readiness

      - name: Maximum production readiness gate
        run: npm run production:readiness:max

      - name: Production control audit
        run: npm run production:controls

      - name: Start E2E server
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/revora-e2e.log 2>&1 &
          echo $! > /tmp/revora-e2e.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/revora-e2e.log
          exit 1

      - name: Test with coverage
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage/
          retention-days: 30

      - name: Stop E2E server
        if: always()
        run: |
          if [ -f /tmp/revora-e2e.pid ]; then
            kill "$(cat /tmp/revora-e2e.pid)" 2>/dev/null || true
          fi

      - name: Production build
        run: npm run build
