name: Apply unified autonomous planner change

on:
  push:
    branches: [feat/revora-unified-autonomous-planner]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'godbody4040-oss'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted planner integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/site-agent.functions.ts')
          text = path.read_text()
          old = '''    const { buildDeterministicPlan } = await import("@/lib/builder/deterministic");
    // Uploads no longer sideline Revora's own builder: the structural work is
    // planned natively, and an outside model is only consulted when the upload's
    // contents genuinely have to be read before anything can change.
    const deterministic = buildDeterministicPlan(agentContext, instruction, {'''
          new = '''    // The primary website-planning endpoint now uses the same Autonomous Brain
    // pipeline as the server planner. This removes the last split-brain path:
    // prompt -> conversation context -> normalization -> diagnosis -> autonomous
    // planning -> deterministic compiler -> v4 quality guard.
    const { buildAutonomousPlan } = await import("@/lib/builder/autonomous-brain");
    const deterministic = buildAutonomousPlan(agentContext, instruction, {'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/apply-unified-autonomous-planner.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/site-agent.functions.ts .github/workflows/apply-unified-autonomous-planner.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat: unify primary planner with autonomous brain'
          git push