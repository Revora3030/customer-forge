# SonarCloud analysis. Needs a SonarCloud account:
#   secret   SONAR_TOKEN
#   variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY
# Until they are set the job reports "not configured" and passes.
name: SonarCloud analysis

on:
  push:
    branches: ["lovable-sync"]
  pull_request:
    branches: ["lovable-sync"]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        env:
          TOKEN: ${{ secrets.SONAR_TOKEN }}
          ORG: ${{ vars.SONAR_ORGANIZATION }}
          KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG" ] && [ -n "$KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::SonarCloud is not configured (needs secret SONAR_TOKEN and variables SONAR_ORGANIZATION, SONAR_PROJECT_KEY); skipping."; fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - name: Analyze with SonarCloud
        if: steps.cfg.outputs.ready == 'true'
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          projectBaseDir: .
