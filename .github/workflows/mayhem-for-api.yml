# Mayhem for API: fuzzes a running API from its OpenAPI spec. Needs:
#   secret    MAYHEM_TOKEN
#   variables MAYHEM_API_URL  (e.g. a staging URL — never production)
#             MAYHEM_API_SPEC (URL of an OpenAPI/Swagger document)
# This app does not publish an OpenAPI spec today, so until all three are set
# the job reports "not configured" and passes.
name: "Mayhem for API"

on:
  push:
    branches: ["lovable-sync"]
  pull_request:
    branches: ["lovable-sync"]

jobs:
  mayhem-for-api:
    name: Mayhem for API
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check configuration
        id: cfg
        env:
          TOKEN: ${{ secrets.MAYHEM_TOKEN }}
          URL: ${{ vars.MAYHEM_API_URL }}
          SPEC: ${{ vars.MAYHEM_API_SPEC }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$URL" ] && [ -n "$SPEC" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Mayhem for API is not configured (needs secret MAYHEM_TOKEN and variables MAYHEM_API_URL, MAYHEM_API_SPEC); skipping."; fi

      - name: Mayhem for API
        if: steps.cfg.outputs.ready == 'true'
        uses: ForAllSecure/mapi-action@v1
        continue-on-error: true
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          api-url: ${{ vars.MAYHEM_API_URL }}
          api-spec: ${{ vars.MAYHEM_API_SPEC }}
          duration: 60
          sarif-report: mapi.sarif

      - name: Upload SARIF file
        if: ${{ steps.cfg.outputs.ready == 'true' && hashFiles('mapi.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mapi.sarif
