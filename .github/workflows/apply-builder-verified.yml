name: Apply verified builder fixes

on:
  push:
    branches: [fix/builder-master-apply-verified]
    paths:
      - .github/workflows/apply-builder-verified.yml
      - .patches/apply-builder-verified.patch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/builder-master-apply-verified
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply verified source changes
        run: |
          git apply --check .patches/apply-builder-verified.patch
          git apply .patches/apply-builder-verified.patch
      - run: bun run typecheck
      - run: bun test
      - name: Commit final source state
        run: |
          rm -f \
            .github/workflows/apply-builder-master-improvements.yml \
            .github/workflows/apply-builder-verified.yml \
            .patches/builder-master-improvements.patch \
            .patches/apply-builder-verified.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            src/lib/site-agent.functions.ts \
            src/lib/builder/master-engine.ts \
            .github/workflows/apply-builder-master-improvements.yml \
            .github/workflows/apply-builder-verified.yml \
            .patches/builder-master-improvements.patch \
            .patches/apply-builder-verified.patch
          git commit -m 'fix: harden builder apply and master engine'
          git push origin HEAD:fix/builder-master-apply-verified
# Retriggers the existing push workflow after branch-state verification.
