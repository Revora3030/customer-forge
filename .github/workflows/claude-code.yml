name: Claude Code

# Jarvis hands coding requests to Claude Code by opening an issue labelled
# "claude-code". Claude works on its own branch and posts its progress and a
# pull request link on the issue; nothing reaches lovable-sync until a person
# merges it. "@claude" in a comment on that issue or a pull request asks for
# follow-up changes. Only the repository's owner, members and collaborators
# can start a run, so outside comments on a public repo can't spend the key.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-code-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' &&
        github.event.label.name == 'claude-code' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name != 'issues' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Claude runs the same checks a contributor runs, so it needs the
      # project's dependencies installed.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # New work starts from the Lovable-connected branch, never main.
          base_branch: lovable-sync
          claude_args: >-
            --allowedTools "Bash(npm run typecheck),Bash(npm run lint),Bash(npm run build),Bash(npx tsc:*),Bash(npx eslint:*),Bash(npx vitest:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --append-system-prompt "This is a TanStack Start + Supabase app connected to Lovable (see AGENTS.md). Never force-push or rewrite pushed history. Before you finish, run npx tsc --noEmit, npx eslint on the files you changed, and npx vitest run on the related tests, and fix what fails. Never skip or disable a test."
          # Set ONE of these repository secrets: CLAUDE_CODE_OAUTH_TOKEN (from
          # `claude setup-token`, uses a Claude subscription) or
          # ANTHROPIC_API_KEY (pay per use from console.anthropic.com).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude-code
