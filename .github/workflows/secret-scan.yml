name: Secret Leak Scan

# TruffleHog (roadmap Phase 5). Scans only the commits a push or pull request
# adds, and fails when it finds a credential its provider confirms is live.
on:
  push:
    branches: [lovable-sync, main]
  pull_request:
    branches: [lovable-sync, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revora-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: Verified secrets in new commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          extra_args: --results=verified,unknown
