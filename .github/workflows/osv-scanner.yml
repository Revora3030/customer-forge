# OSV-Scanner: checks npm dependencies against the OSV vulnerability database.
# OSV cannot read bun.lock, so a package-lock.json is generated for the scan
# only (never committed). Findings go to the GitHub Security tab.
name: OSV-Scanner

on:
  pull_request:
    branches: ["lovable-sync"]
  merge_group:
    branches: ["lovable-sync"]
  schedule:
    - cron: "30 15 * * 1"
  push:
    branches: ["lovable-sync"]

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  scan:
    name: scan-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate a lockfile OSV can read
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.2
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --format=sarif
            --output=osv-results.sarif

      - name: Upload results to GitHub
        if: ${{ always() && hashFiles('osv-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
