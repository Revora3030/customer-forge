name: Site Forge primary planner migration

on:
  push:
    branches:
      - feat/revora-primary-autonomous-planner

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor == 'godbody4040-oss'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire primary planner to Autonomous Brain
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/site-agent.functions.ts')
          text = path.read_text()
          old = 'const { buildDeterministicPlan } = await import("@/lib/builder/deterministic");'
          new = 'const { buildAutonomousPlan } = await import("@/lib/builder/autonomous-brain");'
          if old not in text:
              raise SystemExit('expected planner import not found')
          text = text.replace(old, new, 1)
          old_call = 'const deterministic = buildDeterministicPlan(agentContext, instruction, {'
          new_call = 'const deterministic = buildAutonomousPlan(agentContext, instruction, {'
          if old_call not in text:
              raise SystemExit('expected planner call not found')
          text = text.replace(old_call, new_call, 1)
          path.write_text(text)
          PY
          rm .github/workflows/site-forge-primary-planner-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/site-agent.functions.ts .github/workflows/site-forge-primary-planner-once.yml
          git commit -m 'feat: wire primary site planner through autonomous brain'
          git push
