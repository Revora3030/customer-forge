name: Supabase Migration Drift

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Repository ↔ production migration parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-online

      - name: Compare applied migrations with source
        env:
          SUPABASE_DB_URL: ${{ secrets.REVORA_SUPABASE_DB_URL }}
        run: npm run supabase:drift
