name: Revora Weekly Link Check
# lychee (Apache-2.0/MIT, https://github.com/lycheeverse/lychee-action) against
# every URL in the live platform sitemap (the single /sitemap.xml).
# Report-only: never fails, never opens issues; the report is an artifact.
on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: revora-links-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  lychee:
    name: Broken link check (live sitemap)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Expand live sitemaps into a URL list
        run: bash scripts/expand-sitemaps.sh https://revoragrowthsystems.com/sitemap.xml > lychee-urls.txt
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200..=299,429
            --timeout 20
            --exclude-path node_modules
            --exclude '^https?://(www\.)?(facebook|instagram|linkedin|x|twitter|tiktok|youtube)\.com'
            --exclude '^mailto:'
            --exclude '^tel:'
            lychee-urls.txt
          output: lychee-report.md
          format: markdown
          fail: false
          jobSummary: true
      - name: Upload link report
        if: always() && hashFiles('lychee-report.md') != ''
        continue-on-error: true  # a full Actions artifact quota must not fail a job whose checks passed
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report-${{ github.run_id }}
          path: lychee-report.md
          retention-days: 30
