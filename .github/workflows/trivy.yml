name: Revora Trivy Security Scan
on:
  push:
    branches: [lovable-sync, main]
  pull_request:
    branches: [lovable-sync, main]
  schedule:
    - cron: "19 6 * * 2"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
concurrency:
  group: revora-trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: Dependency, secret and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
      - name: Upload Trivy findings
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
      - name: Preserve scan report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-${{ github.run_id }}
          path: trivy-results.sarif
          retention-days: 30
