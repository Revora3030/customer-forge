name: Revora Trivy Security Scan
on:
  push:
    branches: [lovable-sync, main]
  pull_request:
    branches: [lovable-sync, main]
  schedule:
    - cron: "19 6 * * 2"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
concurrency:
  group: revora-trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: Dependency, secret and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          version: v0.76.0
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          # Baseline-first rollout: findings are uploaded as SARIF and artifact.
          # Flip to 1 after the existing repository baseline is triaged.
          exit-code: "0"
      - name: Upload Trivy findings
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
      - name: Preserve scan report
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true  # a full Actions artifact quota must not fail a job whose checks passed
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif-${{ github.run_id }}
          path: trivy-results.sarif
          retention-days: 30
