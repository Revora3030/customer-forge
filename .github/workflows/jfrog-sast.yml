# JFrog SAST scan. Needs a JFrog Advanced Security account:
#   secrets JF_URL, JF_ACCESS_TOKEN
# Until they are set the job reports "not configured" and passes.
name: "JFrog SAST Scan"

on:
  push:
    branches: ["lovable-sync"]
  pull_request:
    branches: ["lovable-sync"]
  schedule:
    - cron: "16 3 * * 5"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      JF_URL: ${{ secrets.JF_URL }}
      JF_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -n "$JF_URL" ] && [ -n "$JF_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::JFrog is not configured (needs secrets JF_URL and JF_ACCESS_TOKEN); skipping."; fi

      - name: Checkout repository
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and configure JFrog CLI
        if: steps.cfg.outputs.ready == 'true'
        run: |
          npm install -g jfrog-cli-v2-jf
          echo "$JF_TOKEN" | jf c add --interactive=false --url="$JF_URL" --access-token-stdin

      - name: Run JFrog SAST
        if: steps.cfg.outputs.ready == 'true'
        run: jf audit --sast --format=sarif > jfrog_sast.sarif

      - name: Upload results
        if: ${{ steps.cfg.outputs.ready == 'true' && hashFiles('jfrog_sast.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: jfrog_sast.sarif
