name: Revora Security Gate

on:
  pull_request:
    branches: [lovable-sync]
  push:
    branches: [lovable-sync]

permissions:
  contents: read

jobs:
  security:
    name: Repository security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository security audit
        run: node scripts/security-audit.mjs
      - name: Production security controls
        run: node scripts/production-control-audit.mjs
      - name: Production readiness contract
        run: node scripts/production-readiness-audit.mjs
      - name: Whole repository security contract
        run: node scripts/whole-repo-upgrade-audit.contract.mjs

  stripe-catalog-contract:
    name: Live Stripe catalog matches the pinned offer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Fails closed: without the key, or on any divergence between the live
      # Stripe catalog and the pinned $350 + $100/month (DEFAULT_OFFER_RATES) offer, the gate fails
      # and the deploy is blocked instead of charging customers wrong amounts.
      # Dependabot PRs never receive repository secrets, so the live check can
      # only fail there. Skip it for Dependabot only; every other PR and every
      # push to lovable-sync (including the merge of a Dependabot PR) still
      # runs it and still fails closed when the key is missing.
      - name: Skip live Stripe check on Dependabot PRs (no secrets available)
        if: github.actor == 'dependabot[bot]'
        run: echo "::notice::Dependabot PR - live Stripe catalog contract runs on the push to lovable-sync after merge."
      - name: Verify live Stripe catalog against the canonical offer
        if: github.actor != 'dependabot[bot]'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: bun scripts/stripe-catalog-contract.mjs --env=live
