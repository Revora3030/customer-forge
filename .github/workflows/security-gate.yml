name: Revora Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Repository security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository security audit
        run: node scripts/security-audit.mjs
      - name: Focused security tests
        run: npm test -- src/lib/security/repository-security.test.ts
