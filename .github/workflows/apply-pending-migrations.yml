name: Apply Pending Migrations

# Applies repo migrations missing from the production migration history.
# Manual only. Start with plan (SELECT only), reconcile history, then use a
# staging dry-run. A transaction rollback is not a substitute for a backup.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (read only), dry-run (executes then rolls back), or apply"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - dry-run
          - apply
      project_ref:
        description: "Confirmed Supabase project ref matching the database secret"
        required: true
      confirm:
        description: 'For mode=apply, type APPLY to confirm'
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: revora-apply-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Pending migrations (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard apply confirmation
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'APPLY' }}
        run: |
          echo "::error::mode=apply requires confirm=APPLY"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run
        env:
          SUPABASE_DB_URL: ${{ secrets.REVORA_SUPABASE_DB_URL }}
          MODE: ${{ inputs.mode }}
          EXPECTED_SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
          CONFIRM_APPLY: ${{ inputs.confirm }}
        run: node scripts/apply-pending-migrations.mjs

      - name: Drift check after apply
        if: ${{ inputs.mode == 'apply' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.REVORA_SUPABASE_DB_URL }}
        run: npm run supabase:drift
