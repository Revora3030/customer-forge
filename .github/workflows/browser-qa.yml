name: Revora Browser QA

on:
  push:
    branches: [lovable-sync]
  pull_request:
    branches: [lovable-sync]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional externally hosted URL to inspect"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: revora-browser-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chromium rendered-site QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Install dependencies and browser
        run: |
          npm install --no-audit --no-fund --prefer-online
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start application
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.base_url == '' }}
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/revora-browser.log 2>&1 &
          echo $! > /tmp/revora-browser.pid
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/revora-browser.log
          exit 1

      - name: Browser smoke (full viewport matrix)
        env:
          BROWSER_QA_BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:8080' }}
          BROWSER_QA_ROUTES: "/,/about,/pricing,/contact,/get-started,/industries,/demo,/website-audit,/growth-assessment,/auth,/privacy,/terms"
        run: npm run browser:smoke -- --require-browser

      - name: Public page sweep (phone + desktop, every page family)
        env:
          BROWSER_QA_BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:8080' }} # DevSkim: ignore DS162092,DS137138 -- CI-only local app under test.
        # Exit 1 on any P0 finding, exit 2 when no browser could run (never a silent pass).
        run: |
          mkdir -p browser-qa-artifacts
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install chromium
          npm run site:sweep -- "$BROWSER_QA_BASE_URL" --max=80 --out=browser-qa-artifacts/page-sweep.json


      - name: Install agent-browser CLI
        run: |
          npm install --global agent-browser
          agent-browser install
      - name: Verify rendered page with agent-browser
        env:
          BROWSER_QA_BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:8080' }} # DevSkim: ignore DS162092,DS137138 -- CI-only local app under test.
        run: |
          mkdir -p browser-qa-artifacts
          agent-browser open "$BROWSER_QA_BASE_URL"
          agent-browser wait --load domcontentloaded
          title="$(agent-browser get title)"
          test -n "$title"
          printf '%s\n' "$title" > browser-qa-artifacts/agent-browser-title.txt
          agent-browser snapshot -i > browser-qa-artifacts/agent-browser-snapshot.txt
          agent-browser screenshot --full browser-qa-artifacts/agent-browser-home.png
          agent-browser close
      - name: Upload browser evidence
        # Screenshots are ~45 MB a run; keep them only when the check failed,
        # and briefly, so they cannot fill the repository's artifact quota again.
        if: failure()
        continue-on-error: true  # a full Actions artifact quota must not fail a job whose checks passed
        uses: actions/upload-artifact@v7
        with:
          name: revora-browser-qa-${{ github.run_id }}
          path: browser-qa-artifacts
          if-no-files-found: warn
          retention-days: 3

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/revora-browser.pid ]; then
            kill "$(cat /tmp/revora-browser.pid)" 2>/dev/null || true
          fi
