# ESLint code scanning: runs the repository's own ESLint 9 flat config and
# uploads the findings to the GitHub Security tab. The required lint gate is
# "Typecheck, lint, test, build" (quality-gate.yml); this job only reports.
name: ESLint

on:
  push:
    branches: ["lovable-sync"]
  pull_request:
    branches: ["lovable-sync"]
  schedule:
    - cron: "31 2 * * 6"

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @microsoft/eslint-formatter-sarif@3.1.0

      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: npx eslint . --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        if: ${{ always() && hashFiles('eslint-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
