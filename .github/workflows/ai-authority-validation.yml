name: AI Authority Validation

on:
  pull_request:
    branches:
      - lovable-sync
  push:
    branches:
      - lovable-sync

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, and production audits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Security audit
        run: bun run security:audit

      - name: Start E2E server
        run: |
          bun run dev -- --host 127.0.0.1 --port 8080 > /tmp/revora-e2e.log 2>&1 &
          echo $! > /tmp/revora-e2e.pid
          for i in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/revora-e2e.log
          exit 1

      - name: Full Vitest suite
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_REQUIRE_SERVER: "1"
        run: bunx vitest run

      - name: Production control audit
        run: node scripts/production-control-audit.mjs

      - name: Production readiness max audit
        run: node scripts/production-readiness-max-audit.mjs

      - name: Whole-repo upgrade audit
        run: node scripts/whole-repo-upgrade-audit.mjs
