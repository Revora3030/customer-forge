name: AI Authority Validation

on:
  pull_request:
    branches:
      - lovable-sync
  push:
    branches:
      - lovable-sync

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, and production audits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck with tsgo
        run: bunx tsgo

      - name: Full Vitest suite
        run: bunx vitest run

      - name: Production control audit
        run: node scripts/production-control-audit.mjs

      - name: Production readiness max audit
        run: node scripts/production-readiness-max-audit.mjs

      - name: Whole-repo upgrade audit
        run: node scripts/whole-repo-upgrade-audit.mjs
